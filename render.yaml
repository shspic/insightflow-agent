services:
  - type: web
    name: insightflow-agent-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: InsightFlow Agent
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: UPLOAD_DIR
        value: ./storage/uploads
      - key: CHART_DIR
        value: ./storage/charts
      - key: REPORT_DIR
        value: ./storage/reports
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:5173
      - key: AUTH_SECRET_KEY
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: ENABLE_LEGACY_V1_API
        value: "false"
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_BASE_URL
        value: ""
      - key: LLM_API_KEY
        sync: false
      - key: RAG_RETRIEVAL_MODE
        value: auto
      - key: RAG_TOP_K
        value: "5"
      - key: RAG_CHUNK_SIZE
        value: "800"
      - key: RAG_CHUNK_OVERLAP
        value: "100"
      - key: TESSERACT_CMD
        value: ""
      - key: OCR_LANG
        value: chi_sim+eng
